<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chat View</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <style>
    :root {
      --wa-bg: #111b21;
      --wa-chat-bg: #0b141a;
      --wa-header-bg: #202c33;
      --wa-incoming: #202c33;
      --wa-outgoing: #005c4b;
      --wa-text: #e9edef;
      --wa-subtle: #8696a0;
      --wa-link: #53bdeb;
      --wa-highlight-bg: #615b30;
      --wa-danger: #eb4d4b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--wa-bg);
      color: var(--wa-text);
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      max-width: 900px;
      margin: 0 auto;
      background: var(--wa-chat-bg);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Header (top bar) */
    .header {
      height: 60px;
      background: var(--wa-header-bg);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 12px;
      flex-shrink: 0;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #005c4b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
      color: var(--wa-text);
    }

    .header-text {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }

    .header-text .name {
      font-weight: 500;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-text .subtitle {
      font-size: 12px;
      color: var(--wa-subtle);
    }

    .header-actions {
      display: flex;
      gap: 12px;
      font-size: 18px;
      color: var(--wa-subtle);
      align-items: center;
      position: relative;
    }

    .header-actions span {
      cursor: pointer;
    }

    /* Simple dropdown menu for logout */
    .menu {
      position: absolute;
      top: 40px;
      right: 0;
      background: #111b21;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      padding: 4px 0;
      min-width: 140px;
      display: none;
      z-index: 10;
    }

    .menu.open {
      display: block;
    }

    .menu-item {
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      color: var(--wa-text);
      text-align: left;
      margin: 2px 6px;
      border-radius: 4px;
    }

    .menu-item.logout {
      color: var(--wa-danger);
    }

    .menu-item:hover {
      background: #202c33;
    }

    /* Search bar (under header) */
    .search-bar {
      background: var(--wa-header-bg);
      padding: 6px 10px;
      display: none;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .search-bar.active {
      display: flex;
    }

    .search-input {
      flex: 1;
      background: #111b21;
      border-radius: 999px;
      border: none;
      padding: 8px 12px;
      font-size: 14px;
      color: var(--wa-text);
      outline: none;
    }

    .search-input::placeholder {
      color: var(--wa-subtle);
    }

    .search-count {
      font-size: 12px;
      color: var(--wa-subtle);
      white-space: nowrap;
    }

    /* Chat area */
    .chat {
      flex: 1;
      padding: 8px 6px 12px;
      background: #0a0b0b;
      background-size: cover;
      background-position: center;
      overflow-y: auto;
    }

    .message-row {
      display: flex;
      margin: 2px 4px;
    }

    .message-row.me {
      justify-content: flex-end;
    }

    .message-row.them {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 80%;
      padding: 6px 6px 3px 8px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
      position: relative;
      word-wrap: break-word;
      white-space: pre-wrap;
      color: var(--wa-text);
    }

    .bubble.me {
      background: var(--wa-outgoing);
      border-bottom-right-radius: 0;
    }

    .bubble.them {
      background: var(--wa-incoming);
      border-bottom-left-radius: 0;
    }

    /* Bubble tails */
    .bubble.me::after {
      content: "";
      position: absolute;
      right: -2px;
      bottom: 0;
      border-width: 8px 0 0 8px;
      border-style: solid;
      border-color: transparent transparent transparent var(--wa-outgoing);
    }

    .bubble.them::before {
      content: "";
      position: absolute;
      left: -2px;
      bottom: 0;
      border-width: 8px 8px 0 0;
      border-style: solid;
      border-color: transparent var(--wa-incoming) transparent transparent;
    }

    .author {
      font-size: 11px;
      color: var(--wa-subtle);
      margin-bottom: 2px;
    }

    .meta {
      display: flex;
      justify-content: flex-end;
      font-size: 11px;
      color: var(--wa-subtle);
      margin-top: 2px;
      gap: 3px;
      align-items: center;
    }

    .ticks {
      font-size: 12px;
    }

    /* Highlight for search matches */
    mark {
      background: var(--wa-highlight-bg);
      color: var(--wa-text);
      padding: 0 1px;
      border-radius: 2px;
    }

    /* Bottom bar (input lookalike) */
    .footer {
      background: var(--wa-header-bg);
      padding: 8px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .footer-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--wa-subtle);
    }

    .footer-input-fake {
      flex: 1;
      background: #202c33;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 14px;
      color: var(--wa-subtle);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    a.link {
      color: var(--wa-link);
      text-decoration: none;
    }

    /* Login screen overlay */
    .login-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, #202c33 0, #0b141a 45%, #000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .login-card {
      background: #111b21;
      border-radius: 16px;
      padding: 24px 20px 20px;
      width: min(360px, 90vw);
      box-shadow: 0 14px 28px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .login-title {
      font-size: 18px;
      font-weight: 600;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--wa-subtle);
    }

    .login-input {
      margin-top: 8px;
      width: 100%;
      background: #0b141a;
      border-radius: 999px;
      border: 1px solid #202c33;
      padding: 10px 14px;
      font-size: 14px;
      color: var(--wa-text);
      outline: none;
    }

    .login-input::placeholder {
      color: var(--wa-subtle);
    }

    .login-button {
      margin-top: 8px;
      width: 100%;
      border-radius: 999px;
      border: none;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: #00a884;
      color: #0b141a;
    }

    .login-error {
      font-size: 12px;
      color: var(--wa-danger);
      min-height: 16px;
    }

    /* Loading overlay while messages load */
    .loading-overlay {
      position: absolute;
      inset: 60px 0 0; /* below header */
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 15;
    }

    .loading-overlay.active {
      display: flex;
    }

    .loader {
      border: 4px solid #202c33;
      border-top: 4px solid #00a884;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
    }

    .loading-text {
      font-size: 14px;
      color: var(--wa-subtle);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Fullscreen BBC News overlay */
    .image-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      align-items: stretch;
      justify-content: center;
      z-index: 30;
    }

    .image-overlay.active {
      display: flex;
    }

    .image-overlay iframe {
      border: none;
      width: 100%;
      height: 100%;
    }

    /* Floating button bottom right */
    .fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #00a884;
      color: #0b141a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 31;
      user-select: none;
    }

    /* Mobile tweaks */
    @media (max-width: 600px) {
      .header {
        padding: 0 8px;
      }
      .chat {
        padding: 6px 4px 10px;
      }
      .bubble {
        max-width: 90%;
      }
      .login-card {
        border-radius: 0;
        box-shadow: none;
      }
      .fab {
        bottom: 16px;
        right: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Login overlay -->
    <div class="login-overlay" id="loginOverlay">
      <div class="login-card">
        <div class="login-title">Enter Chat Password</div>
        <div class="login-subtitle">This chat is private. Please enter the password to continue.</div>
        <input
          id="passwordInput"
          class="login-input"
          type="password"
          placeholder="Password"
        />
        <button id="loginButton" class="login-button">Login</button>
        <div id="loginError" class="login-error"></div>
      </div>
    </div>

    <!-- Loading overlay while chat messages load -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loader"></div>
      <div class="loading-text">Loading chat…</div>
    </div>

    <!-- Fullscreen BBC News overlay -->
    <div class="image-overlay" id="imageOverlay">
      <iframe
        id="bbcFrame"
        src="https://www.bbc.com/sport/cricket/article/cpmd71e0ne8o"
        title="BBC News - England Cricket"
      ></iframe>
    </div>

    <!-- Chat UI -->
    <div class="header">
      <div class="avatar" id="avatar">Am</div>
      <div class="header-text">
        <div class="name" id="chatName">Ammu</div>
        <div class="subtitle">online</div>
      </div>
      <div class="header-actions">
        <span class="search-toggle" id="searchToggle">🔍</span>
        <span id="refreshBtn" title="Refresh chat">⟳</span>
        <span id="menuToggle">⋮</span>
        <div class="menu" id="menu">
          <div class="menu-item logout" id="logoutBtn">Logout</div>
        </div>
      </div>
    </div>

    <!-- Search bar -->
    <div class="search-bar" id="searchBar">
      

      <input
        id="searchInput"
        class="search-input"
        type="search"
        placeholder="Search in chat"
      />
      <div class="search-count" id="searchCount">0 results</div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="footer">
      <div class="footer-icon">😊</div>
      <div class="footer-input-fake">
        Static view. Update messages in <a class="link" href="admin.html">admin</a>.
      </div>
      <div class="footer-icon">🎤</div>
    </div>
  </div>

  <!-- Floating button to toggle BBC News overlay -->
  <div class="fab" id="imageToggleBtn" title="Show BBC News">📰</div>

  <script>
    const ME_NAME = "Samridhi";
    const CHAT_PASSWORD = "Js123";
    const LOGIN_KEY = "chat_logged_in_v1";

    let allMessages = [];

    const loadingOverlay = document.getElementById("loadingOverlay");
    const imageOverlay = document.getElementById("imageOverlay");
    const imageToggleBtn = document.getElementById("imageToggleBtn");

    function showLoading() {
      loadingOverlay.classList.add("active");
    }

    function hideLoading() {
      loadingOverlay.classList.remove("active");
    }

    function formatTime(dateStr) {
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return "";
      let h = d.getHours();
      const m = d.getMinutes().toString().padStart(2, "0");
      const ampm = h >= 12 ? "pm" : "am";
      h = h % 12 || 12;
      return h + ":" + m + " " + ampm;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function highlightText(text, query) {
      if (!query) return escapeHtml(text);
      const safeQuery = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const regex = new RegExp(safeQuery, "gi");
      return escapeHtml(text).replace(regex, (match) => `<mark>${match}</mark>`);
    }

    function renderMessages(filter = "") {
      const chat = document.getElementById("chat");
      const q = filter.trim().toLowerCase();
      chat.innerHTML = "";
      let matchedCount = 0;

      allMessages.forEach((msg) => {
        const textLower = (msg.text || "").toLowerCase();
        const match = q ? textLower.includes(q) : true;

        if (!match && q) return;

        if (match && q) matchedCount++;

        const row = document.createElement("div");
        const isMe = msg.author === ME_NAME;
        row.className = "message-row " + (isMe ? "me" : "them");

        const bubble = document.createElement("div");
        bubble.className = "bubble " + (isMe ? "me" : "them");

        if (!isMe) {
          const author = document.createElement("div");
          author.className = "author";
          author.textContent = msg.author;
          bubble.appendChild(author);
        }

        const textDiv = document.createElement("div");
        textDiv.innerHTML = highlightText(msg.text, q);
        bubble.appendChild(textDiv);

        const meta = document.createElement("div");
        meta.className = "meta";
        const timeSpan = document.createElement("span");
        timeSpan.textContent = formatTime(msg.date);
        meta.appendChild(timeSpan);

        if (isMe) {
          const ticks = document.createElement("span");
          ticks.className = "ticks";
          ticks.textContent = "✓✓";
          meta.appendChild(ticks);
        }

        bubble.appendChild(meta);
        row.appendChild(bubble);
        chat.appendChild(row);
      });

      document.getElementById("searchCount").textContent =
        q ? `${matchedCount} result${matchedCount !== 1 ? "s" : ""}` : "0 results";

      chat.scrollTop = chat.scrollHeight;
    }

    async function loadMessages() {
      showLoading();
      try {
        const res = await fetch("data.json?t=" + Date.now());
        const messages = await res.json();
        allMessages = messages;
        const currentQuery = document.getElementById("searchInput").value || "";
        renderMessages(currentQuery);
      } catch (e) {
        console.error(e);
      } finally {
        hideLoading();
      }
    }

    // Search UI behavior
    const searchToggle = document.getElementById("searchToggle");
    const searchBar = document.getElementById("searchBar");
    const searchInput = document.getElementById("searchInput");

    searchToggle.addEventListener("click", () => {
      const active = searchBar.classList.toggle("active");
      if (active) {
        searchInput.focus();
      } else {
        searchInput.value = "";
        renderMessages("");
      }
    });

    searchInput.addEventListener("input", (e) => {
      const value = e.target.value;
      renderMessages(value);
    });

    // Refresh button
    const refreshBtn = document.getElementById("refreshBtn");
    refreshBtn.addEventListener("click", () => {
      loadMessages();
    });

    // Menu + logout
    const menuToggle = document.getElementById("menuToggle");
    const menu = document.getElementById("menu");
    const logoutBtn = document.getElementById("logoutBtn");

    menuToggle.addEventListener("click", () => {
      menu.classList.toggle("open");
    });

    document.addEventListener("click", (e) => {
      if (!menu.contains(e.target) && e.target !== menuToggle) {
        menu.classList.remove("open");
      }
    });

    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem(LOGIN_KEY);
      menu.classList.remove("open");
      window.location.replace("about:blank");
    });

    // Login handling
    const loginOverlay = document.getElementById("loginOverlay");
    const passwordInput = document.getElementById("passwordInput");
    const loginButton = document.getElementById("loginButton");
    const loginError = document.getElementById("loginError");

    function tryLogin() {
      const value = passwordInput.value.trim();
      if (value === CHAT_PASSWORD) {
        localStorage.setItem(LOGIN_KEY, "true");
        loginOverlay.style.display = "none";
        loginError.textContent = "";
        passwordInput.value = "";
        loadMessages();
      } else {
        loginError.textContent = "Incorrect password.";
      }
    }

    loginButton.addEventListener("click", tryLogin);

    passwordInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        tryLogin();
      }
    });

    // Floating button toggles BBC News overlay
    imageToggleBtn.addEventListener("click", () => {
      imageOverlay.classList.toggle("active");
    });

    // Clicking overlay also hides it
    imageOverlay.addEventListener("click", (e) => {
      // Avoid closing when clicking inside iframe area if needed
      if (e.target === imageOverlay) {
        imageOverlay.classList.remove("active");
      }
    });

    // On load: check login state
    window.addEventListener("load", () => {
      const loggedIn = localStorage.getItem(LOGIN_KEY) === "true";
      if (loggedIn) {
        loginOverlay.style.display = "none";
        loadMessages();
      } else {
        loginOverlay.style.display = "flex";
      }
    });
  </script>
</body>
</html>
